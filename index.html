<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7dcb4">
  <meta name="description" content="A day in the heat. Ten choices in the life of a delivery rider.">
  <title>Beat the Heat · A Day in the Heat</title>
  <!-- Leave empty for GitHub Pages without a feedback server. -->
  <meta name="feedback-endpoint" content="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="experience" aria-label="Beat the Heat">
    <section id="game" class="game" aria-label="A day in the heat">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="transition" class="transition" aria-hidden="true"></div>
      <div id="intro" class="intro"><h1 class="intro-title">Today, you are a<br>delivery rider.</h1><p>It's hot, but life is still going on.</p><button type="button" id="start" class="start">Start <span aria-hidden="true">→</span></button></div>
      <div id="decision" class="decision" hidden>
        <h1 id="question"></h1>
        <div class="options">
          <button id="upper" class="option upper" aria-keyshortcuts="ArrowUp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6M12 8v13"/></svg><span></span></button>
          <button id="lower" class="option lower" aria-keyshortcuts="ArrowDown"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6M12 3v13"/></svg><span></span></button>
        </div>
      </div>
      <div class="game-time" aria-label="Scene timeline">
        <ol id="game-time-track" class="game-time-track"></ol>
      </div>
    </section>
    <section id="ending" class="ending" hidden aria-label="Your day and the research"></section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
